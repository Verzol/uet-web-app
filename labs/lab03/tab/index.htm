<!DOCTYPE html>
<html lang="vi">
<head>
	<meta charset="utf-8">
	<title>Lab. Tab</title>
	<style>
		body {
			margin: 8px;
			font-family: "Times New Roman", serif;
			font-size: 18px;
		}

		ul.tabs {
			display: flex;
			margin: 0;
			padding: 0;
			list-style: none;
		}

		ul.tabs li {
			padding: 2px 4px;
			border: 1px solid #dcdcdc;
			border-bottom: 0;
			background-color: #cccccc;
			cursor: pointer;
		}

		/* Tab chưa chọn sáng lên khi rê chuột */
		ul.tabs li:not(.duoc-chon):hover {
			background-color: #fcfcfc;
		}

		/* Tab được chọn tô xanh */
		ul.tabs li.duoc-chon {
			background-color: #00ffff;
		}

		iframe {
			width: 100%;
			height: 600px;
			border: 1px solid #999;
		}
	</style>
</head>
<body>
	<!-- Mỗi tab ghi địa chỉ trang cần tải trong data-url -->
	<ul class="tabs">
		<li data-url="https://vnu.edu.vn" title="Đại học Quốc gia Hà Nội">Tab 1</li>
		<li data-url="https://dantri.com.vn" title="Dân trí">Tab 2</li>
		<li data-url="https://znews.vn" title="Znews">Tab 3</li>
		<li data-url="https://vi.wikipedia.org" title="Wikipedia tiếng Việt">Tab 4</li>
	</ul>
	<hr>
	<iframe id="khung" title="Trang của tab đang chọn"></iframe>

	<script>
		const cacTab = document.querySelectorAll("ul.tabs li");
		const khung = document.getElementById("khung");

		cacTab.forEach(function (tab) {
			tab.addEventListener("click", function () {
				// Bỏ chọn tab cũ, tô xanh tab mới
				cacTab.forEach(function (t) { t.classList.remove("duoc-chon"); });
				tab.classList.add("duoc-chon");

				// Tải trang tương ứng vào iframe
				khung.src = tab.dataset.url;
			});
		});

		// Mở sẵn tab đầu tiên
		cacTab[0].click();
	</script>
</body>
</html>
