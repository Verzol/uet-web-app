	<h1>HTML</h1>
	<p>HTML (HyperText Markup Language) mô tả cấu trúc tài liệu web. Trình duyệt đọc HTML, dựng cây DOM rồi hiển thị.</p>
	<p>Mỗi phần tử HTML mang một ngữ nghĩa riêng, ví dụ <code>&lt;address&gt;</code> cho địa chỉ liên hệ, <code>&lt;time&gt;</code> cho mốc thời gian.</p>
